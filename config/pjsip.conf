; Example for /etc/asterisk/pjsip.conf.
; Replace the password and network before enabling this endpoint.

[5310]
type=endpoint
context=local
disallow=all
allow=ulaw
auth=5310-auth
aors=5310
direct_media=no
acl=5310-acl

[5310-auth]
type=auth
auth_type=userpass
username=5310
password=REPLACE_WITH_A_LONG_RANDOM_PASSWORD

[5310]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60

[5310-acl]
type=acl
deny=0.0.0.0/0.0.0.0
permit=192.168.1.0/255.255.255.0
