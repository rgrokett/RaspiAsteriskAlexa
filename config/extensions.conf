; Merge these contexts into /etc/asterisk/extensions.conf.

[alexa_tts]
exten => 5555,1,Answer()
 same => n,Playback(custom/alexa_hello)
 same => n,Playback(custom/alexa_example)
 same => n(record),AGI(alexa.agi,en-us,2,#)
 same => n,Playback(custom/alexa_another)
 same => n,Goto(record)
 same => n,Hangup()

; Add this include to the context used by the trusted local PJSIP endpoint:
;
; [local]
; include => alexa_tts
